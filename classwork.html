<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Movie Rating Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="classwork.html">Movie Rating Finder</a>
        </div>
    </nav>

    <div class="container">
        <input id="movieInput" type="text" class="form-control w-50 mx-auto mb-3" placeholder="Enter a movie title (e.g., The Matrix)">
        <button id="getRatingBtn" class="btn btn-primary d-block mx-auto mb-3">Get Movie Rating</button>
        
        <div id="ratingOutput" class="text-center mt-4 h5"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="classwork.js"></script>

</body>
</html>
